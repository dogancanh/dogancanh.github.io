<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0e0e13; }
  .card {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background: #0e0e13; color: #eaeaf2; padding: 70px 76px;
    display: flex; flex-direction: column; justify-content: space-between;
    background-image: radial-gradient(rgba(255,255,255,.05) 1.5px, transparent 1.5px);
    background-size: 26px 26px;
    font-family: "Silkscreen", monospace;
  }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .logo { font-family: "Silkscreen"; font-weight: 700; font-size: 30px; color: #ffe70a; text-shadow: 3px 3px 0 #07070b; letter-spacing: .05em; }
  .kick { font-size: 18px; color: #8b8b9b; letter-spacing: .1em; }
  .mid { display: flex; align-items: center; justify-content: space-between; gap: 40px; }
  .lhs { max-width: 720px; }
  .role { font-family: "Silkscreen"; font-size: 20px; color: #2bb3c0; letter-spacing: .06em; margin-bottom: 22px; }
  .name-a { font-family: "Pixelify Sans"; font-weight: 700; font-size: 104px; line-height: .9; color: #ffe70a; text-shadow: 5px 5px 0 #07070b; text-transform: uppercase; }
  .name-b { font-family: "Pixelify Sans"; font-weight: 700; font-size: 60px; line-height: 1; color: #eaeaf2; text-shadow: 4px 4px 0 #07070b; text-transform: uppercase; margin-top: 6px; }
  .avatar { border: 3px solid #2d2d3c; box-shadow: 8px 8px 0 #07070b; image-rendering: pixelated; background: #16161f; flex: 0 0 auto; }
  .bottom { display: flex; align-items: flex-end; justify-content: space-between; border-top: 3px solid #2d2d3c; padding-top: 24px; }
  .projects { font-family: "Pixelify Sans"; font-weight: 600; font-size: 24px; color: #eaeaf2; letter-spacing: .02em; }
  .projects .d { color: #ffe70a; margin: 0 12px; }
  .url { font-family: "Silkscreen"; font-size: 20px; color: #8b8b9b; }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="logo">DH_</div>
    <div class="kick">PORTFOLIO · '26</div>
  </div>

  <div class="mid">
    <div class="lhs">
      <div class="role">&gt; FULL-STACK ENGINEER</div>
      <div class="name-a">DOĞANCAN</div>
      <div class="name-b">HIRDAVATÇIOĞLU</div>
    </div>
    <canvas id="avatar" class="avatar" width="192" height="216" style="width:192px;height:216px;"></canvas>
  </div>

  <div class="bottom">
    <div class="projects">GUARDI<span class="d">·</span>MASAMASA<span class="d">·</span>ECCEHOME</div>
    <div class="url">dogancanh.github.io</div>
  </div>
</div>

<script>
  (function () {
    var PAL = { T:"#2bb3c0", o:"#1f96a1", F:"#cbb892", H:"#33241a", S:"#e7b088", s:"#cf9066", C:"#14141d", Y:"#ffe70a", G:"#0e0e13", W:"#eef0f2" };
    var ART = [
      "                ","  TTTTTTTTTTTT  ","  TTTTHHHHTTTT  ","  TTTHHHHHHTTT  ",
      "  TTHHHHHHHHTT  ","  TTHSSSSSSHTT  ","  TTHSSSSSSHTT  ","  TTHGGGGGGHTT  ",
      "  TTHGWGGWGHTT  ","  TTHSSSSSSHTT  ","  TTHHSSSSHHTT  ","  TTTHHSSHHTTT  ",
      "  TTTTHHHHTTTT  ","  TTYCCCCCCYTT  ","  TCCCCCCCCCCT  ","  ToCCCYYCCCoT  ",
      "  FFFFFFFFFFFF  ","  FFFFFFFFFFFF  "
    ];
    var cv = document.getElementById("avatar"), ctx = cv.getContext("2d"), sc = 12;
    for (var r = 0; r < ART.length; r++) for (var c = 0; c < 16; c++) {
      var col = PAL[ART[r].charAt(c)];
      if (col) { ctx.fillStyle = col; ctx.fillRect(c*sc, r*sc, sc, sc); }
    }
  })();
</script>
</body>
</html>
