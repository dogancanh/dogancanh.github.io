<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0e0e13; }
  .card {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background: #0e0e13; color: #eaeaf2; padding: 70px 76px;
    display: flex; flex-direction: column; justify-content: space-between;
    background-image: radial-gradient(rgba(255,255,255,.05) 1.5px, transparent 1.5px);
    background-size: 26px 26px;
    font-family: "JetBrains Mono", monospace;
  }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .logo { font-weight: 800; font-size: 32px; color: #ffe70a; text-shadow: 3px 3px 0 #07070b; letter-spacing: .02em; }
  .kick { font-weight: 700; font-size: 17px; color: #8b8b9b; letter-spacing: .08em; }
  .mid { display: flex; align-items: center; justify-content: space-between; gap: 44px; }
  .lhs { max-width: 720px; }
  .role { font-weight: 700; font-size: 19px; color: #2bb3c0; letter-spacing: .04em; margin-bottom: 22px; }
  .name-a { font-weight: 800; font-size: 90px; line-height: .95; letter-spacing: -.03em; color: #ffe70a; text-shadow: 5px 5px 0 #07070b; }
  .name-b { font-weight: 800; font-size: 52px; line-height: 1; letter-spacing: -.03em; color: #eaeaf2; text-shadow: 4px 4px 0 #07070b; margin-top: 8px; }
  .avatar { width: 240px; height: 240px; image-rendering: pixelated; border: 3px solid #2d2d3c; box-shadow: 8px 8px 0 #07070b; background: #16161f; flex: 0 0 auto; }
  .bottom { display: flex; align-items: flex-end; justify-content: space-between; border-top: 3px solid #2d2d3c; padding-top: 24px; }
  .projects { font-weight: 700; font-size: 22px; color: #eaeaf2; letter-spacing: .02em; }
  .projects .d { color: #ffe70a; margin: 0 10px; }
  .url { font-weight: 500; font-size: 19px; color: #8b8b9b; }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="logo">DH_</div>
    <div class="kick">PORTFOLIO · '26</div>
  </div>

  <div class="mid">
    <div class="lhs">
      <div class="role">&gt; FULL-STACK ENGINEER</div>
      <div class="name-a">DOĞANCAN</div>
      <div class="name-b">HIRDAVATÇIOĞLU</div>
    </div>
    <img class="avatar" src="avatar.png" alt="Doğancan Hırdavatçıoğlu" />
  </div>

  <div class="bottom">
    <div class="projects">GUARDI<span class="d">·</span>MASAMASA<span class="d">·</span>ECCEHOME</div>
    <div class="url">dogancanh.github.io</div>
  </div>
</div>
</body>
</html>
